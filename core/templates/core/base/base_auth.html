{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}WONDER{% endblock %}</title>

   
    <link rel="icon" type="image/svg+xml" href="{% static 'img/icones/icon_roxo/lotus.svg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/toast_validacao.css' %}">

    {% block extra_css %}{% endblock extra_css %}
</head>
<body>


    <div class="toast-container">
        {% if messages %}
            {% for message in messages %}
                <div class="toast {{ message.tags }}">
                    <span>{{ message }}</span>
                    <button class="toast-close">&times;</button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block content %}{% endblock %}

    <script src="{% static 'js/validacao_toasts.js' %}"></script>
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
