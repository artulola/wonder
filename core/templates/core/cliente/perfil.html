{% extends 'core/base/base.html' %}
{% load static %}
{% block title %}WONDER{% endblock title %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/cliente/perfil_usuario.css' %}">
{% endblock extra_css %}

{% block content %}
<main class="profile-page-content">
  
  <div class="profile-card">
    
    <header class="profile-header">
      <img class="profile-avatar" src="{% static 'img/perfil/gustavo.svg' %}" alt="Foto de perfil">
      <a href="#" class="edit-profile-link">
        <img src="{% static 'img/icones/icon_roxo/pencil(1).svg' %}" alt="">
        <span>Editar perfil</span>
      </a>
    </header>

    <section class="user-info-list">
      
      <div class="info-item">
        <div class="info-label-group">
          <img class="info-icon" src="{% static 'img/icones/icon_roxo/user(1).svg' %}" alt="">
          <span class="info-label">Nome</span>
        </div>
        <span class="info-value">Gustavo Emanuel</span>
      </div>
      
      <div class="info-item">
        <div class="info-label-group">
          <img class="info-icon" src="{% static 'img/icones/icon_roxo/email.svg' %}" alt="">
          <span class="info-label">Email</span>
        </div>
        <span class="info-value">gustavinho@gmail.com</span>
      </div>

      <div class="info-item">
        <div class="info-label-group">
          <img class="info-icon" src="{% static 'img/icones/icon_roxo/phone(1).svg' %}" alt="">
          <span class="info-label">Telefone</span>
        </div>
        <span class="info-value">(84) 99485-9785</span>
      </div>

    </section>

    <a href="{% url 'login' %}" class="logout-button">
      <img src="{% static 'img/icones/icon_geral/logout.svg' %}" alt="">
      <span>Sair</span>
    </a>
    
<!-- Modal Editar Perfil -->
<div class="modal-overlay" id="modalEditarPerfil">
  <div class="modal-content">
    <h2 class="modal-title">Editar Perfil</h2>

    <label class="modal-label">Foto de Perfil</label>
    <input type="file" class="modal-input" accept="image/*">

    <label class="modal-label">Nome</label>
    <input type="text" class="modal-input" value="Gustavo Emanuel">

    <label class="modal-label">Email</label>
    <input type="email" class="modal-input" value="gustavinho@gmail.com">

    <label class="modal-label">Telefone</label>
    <input type="text" class="modal-input" value="(84) 99485-9785">

    <div class="modal-buttons">
      <button class="modal-cancel" onclick="fecharModal('modalEditarPerfil')">Cancelar</button>
      <button class="modal-save">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
  function abrirModal(id) {
    document.getElementById(id).style.display = 'flex';
  }

  function fecharModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  // Abrir modal ao clicar em "Editar perfil"
  document.querySelector('.edit-profile-link').addEventListener('click', function(e) {
    e.preventDefault();
    abrirModal('modalEditarPerfil');
  });

  // Fechar ao clicar fora
  document.querySelectorAll('.modal-overlay').forEach(modal => {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  });
</script>




  </div>
</main>
{% endblock content %}
