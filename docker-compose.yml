version: '3.8'

services:
  web:
    build: .
    command: gunicorn wonder.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=wonder_db
      - POSTGRES_USER=wonder_user
      - POSTGRES_PASSWORD=wonder_password

volumes:
  postgres_data: